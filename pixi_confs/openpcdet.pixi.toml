# File recommended by pixi team, but not sure if it goes in the root or in openpcdets

[workspace]
name = "openpcdet"
description = "Pixified openpcdet."
authors = ["Cristobal Medina <krztvl@gmail.com>"]
channels = [
    "https://prefix.dev/conda-forge",
    "numba",
    "open3d-admin",
    "https://prefix.dev/pixi-build-backends",
]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.1.0"

[dependencies]
python = ">3.6,<3.11" # Higher then 3.11 is not available for spconv-cu120
pytorch = ">1.5"

llvmlite = "*"
numba = "*"
tensorboardx = "*"
easydict = "*"
pyyaml = "*"
scikit-image = "*"
tqdm = "*"
torchvision = "*"
SharedArray = "*"
opencv = "*"
pyquaternion = "*"

[pypi-dependencies]
# For CUDA 12
spconv-cu120 = "*"
pcdet = { path = ".", editable=true }




