[workspace]
name = "sample_ros2_project"
version = "0.1.0"
description = "Base ROS2 pixi project."
authors = ["Cristobal Medina <krztvl@gmail.com>"]
channels = [
    "robostack-humble",
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/pixi-build-backends",
]
# Your project can support multiple platforms, the current platform will be automatically added.
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
pixi-build-api-version = { version = "1.*", channel = "https://prefix.dev/pixi-build-backends" }
ros-humble-desktop-full = "*"
ros-humble-turtlesim = "*"
colcon-common-extensions = "*"
setuptools = "<=58.2.0"
ros-humble-joint-state-publisher = "*"
ros-humble-xacro = "*"
ros-humble-ros-ign-bridge = "*"
ros-humble-ros-ign-gazebo = "*"
ros-humble-ros-ign-image = "*"
ros-humble-ros-ign-interfaces = "*"
ros-humble-slam-toolbox = "*"
ros-humble-nav2-bringup = "*"
ros-humble-navigation2 = "*"
ros-humble-rviz2 = "*"
tqdm = "*"

ros-humble-ros2-numpy = { path = "./packages/ros2_numpy" }
ros-humble-dynamic-lidar-interpolation = { path = "./packages/dynamic_lidar_interpolation" }
ros-humble-pointcloud-utils = { path = "./packages/pointcloud_utils" }

# # For openpcdet ROS2 wrapper
# ros-humble-ament-cmake-nose = "*"
# ros-humble-ros2-numpy = { path = "ros2_numpy" }
# ros-humble-pcdet-ros2 = { path = "pcdet_ros2"}

# catkin_pkg = "*"
# nose = "*"


[feature.dev.dependencies]
pytest = "*"
ruff = "*"
mypy = "*"

[environments]
default = { features = ["dev"], solve-group = "prod" }

[tasks]
#these are basically shortcuts to be run in a pixi environment. In the future, I should be able to add my custom nodes with tasks, or something.
#Source: https://pixi.sh/latest/tutorials/ros2/#simplify-the-user-experience

#https://github.com/atinfinity/pixi_ros2_gazebo_example
sim = 'ros2 run turtlesim turtlesim_node'
build = 'colcon build --symlink-install'
hello = 'ros2 run my_package my_node'

[tasks.rviz]
cmd = 'ros2 run rviz2 rviz2 -f velodyne -d {{ config_file }}'
args = [
    { arg = "config_file", default = "/app/data/config_files/rviz/interpolation.rviz" },
]

[tasks.play_velodyne_bag]
cmd = "ros2 bag play {{ bag_path }} {{ loop }}"
args = [
    { arg = "bag_path", default = "data/ros2_bags/rosbag2_2025_10_03-20_38_38/rosbag2_2025_10_03-20_38_38_0.db3" },
    { arg = "loop", default = "--loop" },
]
[tasks.python_bag]
cmd = "python {{ script_path }}"
args = [{ arg = "script_path", default = "src/yolo-lidar.py" }]
# depends-on = [{task = "play_velodyne_bag"}]

[tasks.interpolation_node]
cmd = "ros2 launch dynamic_lidar_interpolation pointcloud_interpolation_optimized_launch.py log_level:={{ log_level }} config_file:={{ config_file }}"
args = [
    { arg = "log_level", default = "info" },
    { arg = "config_file", default = "/packages/dynamic_lidar_interpolation/config/interpolation_config_optimized.yaml" },
]
cwd = "packages/dynamic_lidar_interpolation/launch"

[tasks.bin_publisher]
cmd = "ros2 launch pointcloud_utils bin_publisher_launch.py log_level:={{ log_level }} config_file:={{ config_file }} bin_directory:={{ bin_directory }}"
args = [
    { arg = "log_level", default = "info" },
    { arg = "config_file", default = "/app/packages/poincloud_utils/config/bin_publisher.yaml" },     
    { arg = "bin_directory", default = "/app/data/output/interpolated-kitti/nearest_01/training/velodyne/" }	    
]
cwd = "packages/pointcloud_utils/launch"

### Config file is in /app/.pixi/envs/default/share/dynamic_lidar_interpolation/config/interpolation_config.yaml


