pointcloud_interpolation_node:
  ros__parameters:
    lidar:
      max_range: 1e308 # Maximum range filtering (meters)
      min_range: 0.0    # Minimum range filtering (meters)

    range_image:
      # OPTIMIZED: Reduced resolution for faster processing
      # Original: 0.25 degrees -> New: 0.5 degrees (2x faster)
      angular_resolution_x: 0.5   # Angular resolution in the X direction (degrees) - OPTIMIZED
      angular_resolution_y: 2.05  # Angular resolution in the Y direction (degrees)
      max_angle_width: 360.0     # Maximum angular width of the range image (degrees)
      max_angle_height: 180.0    # Maximum angular height of the range image (degrees)
      min_angle_fov: 0.0      # Minimum angle for the field of view (degrees)
      max_angle_fov: 360.0       # Maximum angle for the field of view (degrees)

    interpolation:
      # OPTIMIZED: Using 'nearest' for fastest interpolation (no computation needed)
      # Options: "linear", "nearest", "bilateral", "edgeAware", "spline"
      # "nearest" is significantly faster than "linear" when scale_factor is 1.0
      method: "nearest"

      # OPTIMIZED: Scale factors set to 1.0 means no upscaling
      # This essentially creates a passthrough with minimal overhead
      scale_factor_x: 1.0         # Scale factor for the point cloud enlargement
      scale_factor_y: 1.0        # Scale factor for the point cloud enlargement

      # OPTIMIZED: Disabled variance filtering for speed
      interpolation_max_var: 50.0             # Maximum allowed variance for filtering
      apply_variance_filter: false # OPTIMIZED: Disabled for performance

      rotation_angle_x: 0.0      # Rotation angle around the X axis (degrees)
      extrapolation_value: "NaN"    # Value to use when extrapolating outside the range
      sensor_translation: [0.0, 0.0, 0.0]  # Translation of the sensor (in 3D space)


    topics:
      lidar_topic: "velodyne_points"          # Input topic for lidar data
      interpolated_point_cloud_topic: "interpolated_point_cloud"  # Output topic for the interpolated point cloud data

    processing:
      # OPTIMIZED: Disabled statistical outlier removal for performance
      filter_pc: false # OPTIMIZED: Disabled for speed (pcdet_node handles filtering internally)
