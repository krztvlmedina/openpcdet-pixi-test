[project]
name = "openpcdet"
requires-python = ">= 3.6"
version = "0.1.0"

[build-system] 
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.pypi-dependencies]
torch = { version = "==2.1.0+cu121", index = "https://download.pytorch.org/whl/cu121"}
torchvision = { version = "==0.16.0+cu121", index = "https://download.pytorch.org/whl/cu121"}
spconv-cu120 = "*"