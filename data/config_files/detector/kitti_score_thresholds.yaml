# Per-class confidence score thresholds used by OpenPCDet's evaluation pipeline.
# Detections below these thresholds are excluded from the "thresholded" image
# variants and from 3D marker display in kitti_inspector.py.
#
# Default values match the KITTI benchmark evaluation protocol used by OpenPCDet.
Car: 0.3
Pedestrian: 0.5
Cyclist: 0.5
